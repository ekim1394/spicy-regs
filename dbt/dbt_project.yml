name: 'spicy_regs'
version: '1.0.0'
config-version: 2

profile: 'spicy_regs'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  data_path: '../sample-data/mirrulations'

models:
  spicy_regs:
    # Configured by default to be views
    staging:
      +materialized: view
    marts:
      +materialized: table
