name: 'spicy_regs'
version: '1.0.0'
config-version: 2

profile: 'spicy_regs'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  spicy_regs:
    # Configures all models in spicy_regs to be materialized as view by default
    +materialized: view
