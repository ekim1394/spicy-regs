
name: 'spicy_regs'
version: '1.0.0'
config-version: 2

profile: 'spicy_regs'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

models:
  spicy_regs:
    # Config for all models
    +materialized: view
    staging:
      +materialized: view

vars:
  data_path: '../sample-data/mirrulations'
