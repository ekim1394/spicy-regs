version: 2

models:
  - name: stg_mirrulations_dockets
    description: "Staged docket data from Mirrulations"
    columns:
      - name: docket_id
        description: "Primary key for the docket"
        tests:
          - unique
          - not_null
      - name: agency_id
        description: "The agency ID associated with the docket"
        tests:
          - not_null
