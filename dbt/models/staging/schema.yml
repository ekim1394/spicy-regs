version: 2

models:
  - name: stg_dockets
    description: Staging model for dockets data
    columns:
      - name: docket_id
        description: Primary key for dockets
        tests:
          - unique
          - not_null
      - name: agency_id
        description: The agency identifier
      - name: title
        description: Title of the docket
      - name: docket_type
        description: Type of the docket
      - name: last_modified_date
        description: The date the docket was last modified
