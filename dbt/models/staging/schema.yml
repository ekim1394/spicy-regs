version: 2

models:
  - name: stg_dockets
    description: "Staging model for dockets data from JSON files."
    columns:
      - name: docket_id
        description: "Primary key for the docket."
        tests:
          - unique
          - not_null
      - name: agency_id
        description: "Agency identifier."
        tests:
          - not_null
