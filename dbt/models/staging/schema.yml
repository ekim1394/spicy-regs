version: 2

models:
  - name: stg_dockets
    description: "Staging model for dockets"
    columns:
      - name: docket_id
        description: "Primary key for dockets"
        tests:
          - unique
          - not_null
      - name: agency_id
        description: "Agency identifier"
        tests:
          - not_null
      - name: title
        description: "Title of the docket"
